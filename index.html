<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACHTUNG 打火机</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="product-area">

      <section class="warning-card" id="warningCard">
        <h1 class="paint-text title-line">ACHTUNG</h1>
        <p class="paint-text middle-text">Sie verlassen jetzt</p>
        <h2 class="paint-text bottom-line">West-Berlin</h2>
      </section>

      <p class="hint-text" id="hintText">点击告示牌查看图片</p>

      <section class="ad-image-box" id="adImageBox">
        <img src="images/lighter.png" alt="ACHTUNG 打火机产品广告图">
      </section>

      <p class="collapse-text" id="collapseText">收起图片</p>

      <button class="info-button" id="infoButton">
        查看详细信息
      </button>

      <section class="back-info" id="backInfo">
        <h3>打火机详细信息</h3>

        <p><strong>品牌来源：</strong>Mauer Museum 柏林墙博物馆</p>
        <p><strong>产品类型：</strong>黑色纪念打火机</p>
        <p><strong>正面文字：</strong>ACHTUNG / Sie verlassen jetzt / West-Berlin</p>
        <p><strong>背面标识：</strong>条形码、安全警示图标、Mauer Museum 标志与官网信息</p>
        <p><strong>视觉风格：</strong>冷战边境告示、黑红白配色、复古刷印字体</p>
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
